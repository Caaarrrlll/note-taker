[config]
default_to_workspace = false

[tasks.clean]
description = "Remove Rust build artifacts"
workspace = false
command = "cargo"
args = ["clean"]

[tasks.clean-frontend]
description = "Remove frontend build artifacts"
script = ["Remove-Item -Recurse -Force web/dist -ErrorAction SilentlyContinue"]

[tasks.clean-all]
description = "Remove all build artifacts and dependencies"
dependencies = ["clean"]
script = '''
Remove-Item -Recurse -Force web/dist -ErrorAction SilentlyContinue
Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
'''

[tasks.clean-git]
description = "Remove all untracked files (git clean)"
script = '''
git clean -fd
'''

[tasks.clean-git-dry]
description = "Preview what git clean would remove"
script = '''
git clean -fdn
'''

[tasks.build]
description = "Build the Tauri application"
script = '''
cargo tauri build
'''

[tasks.dev]
description = "Run Tauri in development mode"
script = '''
cargo tauri dev
'''

[tasks.install]
description = "Install frontend dependencies"
script = '''
npm install
'''

[tasks.test]
description = "Run backend tests (in-memory SQLite; set TEST_DATABASE_URL to test a server DB)"
command = "cargo"
args = ["test", "--workspace"]

[tasks.bundle]
description = "Build installers for the current OS (Windows: .msi + .exe; Linux: .deb + AppImage; macOS: .dmg)"
# A script (run through a shell), not `command`: on Windows npm is npm.cmd,
# which cargo-make can't start directly ("program not found").
script = '''
npm run tauri build
'''

[tasks.icons]
description = "Regenerate all app icons from apps/desktop/icons/app-icon.svg"
script = '''
npm run tauri icon apps/desktop/icons/app-icon.svg
Remove-Item -Recurse -Force apps/desktop/icons/android, apps/desktop/icons/ios -ErrorAction SilentlyContinue
'''

[tasks.server]
description = "Run note-server locally on :8080 (data in ./data; serves web/dist from `cargo make build-web`)"
env = { COOKIE_SECURE = "false" }
command = "cargo"
args = ["run", "--package", "note-server"]

[tasks.build-web]
description = "Build the web (browser) version of the frontend into web/dist"
script = '''
npm run build:web
'''

[tasks.dev-web]
description = "Web frontend dev server on :1420, proxying /api to `cargo make server`"
script = '''
npm run dev:web
'''
