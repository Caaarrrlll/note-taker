<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Note Taker</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; background: #1a1a2e; color: #e0e0e0; }
    h1 { color: #7c3aed; }
    .hint { color: #888; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Note Taker</h1>
  <p>Frontend placeholder — replace with your editor of choice (TipTap, ProseMirror, etc.)</p>
  <p class="hint">Connect to backend via Tauri invoke commands.</p>

  <script>
    const { invoke } = window.__TAURI__?.core || {};
    if (invoke) {
      invoke('list_workspaces', { ownerId: '00000000-0000-0000-0000-000000000000' })
        .then(ws => console.log('Workspaces:', ws))
        .catch(err => console.log('No workspaces yet:', err));
    }
  </script>
</body>
</html>
