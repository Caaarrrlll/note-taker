[package]
name = "note-core"
description = "Note Taker core: entities, migrations, services (no Tauri, no HTTP)"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.5"
async-trait = "0.1"
chrono.workspace = true
sea-orm.workspace = true
sea-orm-migration = { version = "1", features = ["sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
uuid.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
