# Builds installers and attaches them to a *draft* GitHub release.
#
# To release:
#   1. Bump "version" in src-tauri/tauri.conf.json (and package.json / the root Cargo.toml to match)
#   2. Commit, then tag and push:   git tag v0.2.0 && git push origin v0.2.0
#   3. Wait for this workflow, review the draft release on GitHub, and publish it.
#
# Outputs:
#   Windows: .msi and NSIS setup .exe
#   Linux:   .deb, .rpm and .AppImage
#
# Builds are not code-signed yet, so Windows SmartScreen will warn on first run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 (older glibc) so the .deb/AppImage also run on older distros.
        platform: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

      - name: Install Tauri system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Note Taker v__VERSION__
          releaseBody: Download the installer for your platform from the assets below.
          releaseDraft: true
          prerelease: false
