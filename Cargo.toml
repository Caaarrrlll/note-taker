# Cargo workspace (ROADMAP D12): shared core library + apps that use it.
[workspace]
resolver = "2"
members = [
    "crates/note-core",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Caaarrrlll/note-taker"

# Versions and features shared by more than one crate.
[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
sea-orm = { version = "1", features = ["sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Password hashing is deliberately slow; optimise it even in debug builds/tests.
[profile.dev.package.argon2]
opt-level = 3
